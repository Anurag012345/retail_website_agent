[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tavily-demo"
version = "0.1.0"
description = "CLI and test harness for Tavily AI"
authors = [{name = "Retail Demo"}]
requires-python = ">=3.10"
dependencies = [
    "tavily-python>=0.3.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
